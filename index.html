<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>🌸 Kawaii World Database 🌸</title>
    <link href="world.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="world.js" type="text/javascript"></script>
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>🌸 Kawaii World Database 🌸</h1>
            <p class="subtitle">✨ Look up different countries and cities! ✨</p>
        </header>

        <main>
            <div class="search-section">
                <div class="input-group">
                    <div class="country-input">
                        <label for="country">🌍 Country Name:</label>
                        <input id="country" type="search" name="country" placeholder="Enter country name... 🌸" />
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="lookup" class="lookup-btn country-btn">
                        <i class="fas fa-flag"></i> Lookup Countries
                    </button>
                    <button id="lookup-cities" class="lookup-btn city-btn">
                        <i class="fas fa-city"></i> Lookup Cities
                    </button>
                </div>
            </div>
            
            <div class="result-section">
                <h2><i class="fas fa-star"></i> Results:</h2>
                <div id="result">
                    <p class="initial-message">🎀 Your search results will appear here! 🎀</p>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>🌸 INFO2180 Lab 5 - PHP and MySQL 🌸</p>
            <p>Made by Amelia Llewellyn 💖 !</p>
        </footer>
    </div>
</body>
</html>
